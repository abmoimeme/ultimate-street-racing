<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07060f">
<title>USR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#07060f;--card:#12101f;--line:#ffffff1a;--ink:#f4f2ff;--mute:#a8a3c4;--pink:#ff2a6d;--cyan:#05d9e8;--gold:#ffc23d;--green:#39ff9f;--red:#ff5470}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 60px}
header{position:sticky;top:0;z-index:5;background:rgba(7,6,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px 0;margin:0 -12px 12px}
body.reveal header{background:rgba(60,8,30,.95);border-bottom-color:var(--pink)}
.hrow{display:flex;align-items:center;gap:8px}.hrow h1{font:900 16px Orbitron,sans-serif;letter-spacing:1px;margin:0;flex:1;white-space:nowrap}.hrow h1 span{color:var(--pink)}
.tog{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;background:#ffffff0a;cursor:pointer;font:700 12px Inter;color:var(--mute);user-select:none}
.tog i{width:30px;height:18px;border-radius:99px;background:#ffffff22;position:relative;transition:.2s}.tog i:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
body.reveal .tog{border-color:var(--pink);color:#fff;background:#ff2a6d33}body.reveal .tog i{background:var(--pink)}body.reveal .tog i:after{left:14px}
.banner{display:none;background:var(--pink);color:#fff;font:800 11px Inter;letter-spacing:1px;text-align:center;padding:4px;margin:8px -12px 0}body.reveal .banner{display:block}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--mute);font:700 13px Inter;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}nav button.on{background:var(--cyan);color:#021014}
.bar2{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}.bar2 .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--mute);font:700 12px Inter;padding:6px 10px;cursor:pointer}.seg button.on{background:#ffffff18;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:8px 12px;font:800 12px Inter;letter-spacing:.5px;cursor:pointer;background:var(--cyan);color:#021014}.btn.alt{background:#ffffff12;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 8px;font-size:11px}.btn:disabled{opacity:.4}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}.kpi b{display:block;font:900 24px Orbitron,sans-serif;margin-top:2px}.kpi small{color:var(--mute);font-size:11px}
h2{font:800 11px Inter;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.att{display:flex;flex-direction:column;gap:6px}.att div{padding:9px 10px;border-radius:10px;font-weight:600;font-size:13px}.att .bad{background:#ff547020;border:1px solid #ff547055}.att .warn{background:#ffc23d18;border:1px solid #ffc23d55}.att .good{background:#39ff9f14;border:1px solid #39ff9f44;color:var(--green)}
svg{display:block;width:100%;height:auto}svg text{fill:var(--mute);font:600 10px Inter}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);text-align:left;font-weight:800;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #ffffff0d;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover td{background:#ffffff06}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.search{width:100%;background:#0b0a16;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:600 14px Inter;margin-bottom:8px;outline:none}.search:focus{border-color:var(--cyan)}
.pcode{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.5px;background:#ffffff10;border-radius:6px;padding:2px 6px}body.reveal .real{color:var(--pink);font-weight:700}
.funnel .step{margin:8px 0}.funnel .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.funnel .track{height:22px;background:#ffffff0c;border-radius:6px;overflow:hidden;margin-top:4px}.funnel .track i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#05d9e8aa);border-radius:6px}
.drop{font-size:11px;color:var(--red);font-weight:700;margin-left:6px}
.feed .e{padding:10px 0;border-bottom:1px solid #ffffff0d}.feed .e:last-child{border:0}.feed .m{font:600 13px ui-monospace,Menlo,monospace;color:#ffd0da;word-break:break-word}.mute{color:var(--mute)}.tiny{font-size:11px;color:var(--mute)}
.tl .it{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff0a;font-size:13px}.tl .it b{min-width:96px;color:var(--mute);font-weight:600;font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;background:#ffffff10;border:1px solid var(--line)}.pill.y{color:var(--gold)}
.login{max-width:380px;margin:18vh auto 0;padding:0 16px}.login h1{font:900 22px Orbitron,sans-serif;margin:0 0 4px}.login input[type=password]{width:100%;background:#0b0a16;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font:600 16px Inter;outline:none;margin-top:14px}
.err{color:var(--red);font-weight:600;margin-top:10px}.who{background:#0b0a16;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:600 13px Inter;width:180px}
.grid2{display:grid;gap:10px}@media(min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.live{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff0d;cursor:pointer}.live:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #39ff9f22;flex:none;margin-top:5px;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #39ff9f11}}
.live .a{font-weight:800;font-size:15px}.live .m{font-size:12px;color:var(--mute);margin-top:2px}.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;margin:4px 4px 0 0;background:#ffffff10;border:1px solid var(--line)}.chip.bad{color:var(--red);border-color:#ff547055}
.back{background:none;border:0;color:var(--cyan);font:700 13px Inter;cursor:pointer;padding:0;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CFG={databaseURL:"https://ultimate-street-racing-default-rtdb.firebaseio.com"};
firebase.initializeApp(CFG);const db=firebase.database();
const S1='usr-save-7f3a',S2='usr-net-b91c',SUPER_NET='200b30764f8b8a5e8b5590bc',DK='usr_dash_v1';
const SPN={jollof:'Jollof Ventures',jvh:'Jollof Ventures',pah:'Planet Auto Hub',spark:'Elite Global Travel',farm:'Nioro Farms',all:'All sponsors (start screen)'};
const ACT={menu:'🏠 On the start screen',race:'🏁 Street race',drag:'🚦 Stoplight duel',duel:'⚔️ Online duel',chase:'🚨 Police chase',job:'📦 Delivery job',course:'🛣️ Player course',build:'🧱 Building a course',photo:'📸 Photo mode',garage:'🔧 In the crew garage',showroom:'🚗 In the car showroom',menus:'📋 In the menus',paused:'⏸️ Paused',foot:'🚶 Walking around',meet:'🤝 At a car meet',lounge:'🛋️ In the lounge',drive:'🚗 Free driving'};
const CITY={tokyo:'🇯🇵 Tokyo',dakar:'🇸🇳 Dakar'},LANGN={en:'English',fr:'French',it:'Italian'},LIVE_MS=75000;
const MODES={race:'Street race',drag:'Stoplight duel',duel:'Online duel',chase:'Police chase',job:'Delivery job',course:'Player course'};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normCode=s=>{s=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const a=s.match(/^ABMOIMEME([A-Z0-9]{4})([A-Z0-9]{4})([A-Z0-9]{4})$/);return a?'ABMOIMEME-'+a[1]+'-'+a[2]+'-'+a[3]:'';};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24);}
const DAY=864e5,dayK=t=>{const d=new Date(t);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');};
const kDate=k=>new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8));const short=k=>{const d=kDate(k);return(d.getMonth()+1)+'/'+d.getDate();};
const ago=t=>{if(!t)return'never';const s=(Date.now()-t)/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';};
const when=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—',dur=s=>!s?'—':s<60?Math.round(s)+'s':Math.floor(s/60)+'m '+String(Math.round(s%60)).padStart(2,'0')+'s';
const levelOf=xp=>Math.min(999,1+Math.floor(Math.pow((xp||0)/120,1/1.5)));
const ST={admin:null,codes:{},P:[],tab:'overview',range:7,reveal:false,q:{},sel:null,loading:false,when:0,exp:{}};
// ---------- sign-in (one account: the owner) ----------
function renderLogin(err){document.body.classList.remove('reveal');$('app').innerHTML=`<div class="login"><h1>USR ADMIN</h1><div class="mute">Private owner page · Ultimate Street Racing</div>
 <input type="password" id="pw" placeholder="Password" autocomplete="current-password"><label class="tiny" style="display:flex;gap:6px;align-items:center;margin:10px 0"><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
 <button class="btn" id="go" style="width:100%;padding:12px">SIGN IN</button>${err?`<div class="err">${esc(err)}</div>`:''}<div class="tiny" style="margin-top:14px">Your password is your ABMOIMEME super-user code.</div></div>`;
 $('go').onclick=()=>signIn($('pw').value,$('rem').checked);$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click();};$('pw').focus();}
async function signIn(raw,rem){const c=normCode(raw);if(!c){renderLogin('Wrong password.');return;}const save=await sha(S1+c),net=await sha(S2+c);if(net!==SUPER_NET){renderLogin('Wrong password.');return;}
 let rec=null;try{rec=(await db.ref('usr/players/'+save).once('value')).val();}catch(e){renderLogin('Could not reach the database.');return;}
 ST.admin={save,rec};ST.codes=(rec&&rec.codes)||{};if(rem)try{localStorage.setItem(DK,c);}catch(e){}await importNames();load();}
async function importNames(){const m=location.hash.match(/names=([^&]+)/);if(!m)return;let n=0;
 decodeURIComponent(m[1]).split(',').forEach(x=>{const i=x.indexOf(':');if(i<0)return;const code=x.slice(0,i).trim().toUpperCase(),who=x.slice(i+1).trim().slice(0,40);if(!ST.codes[code]||!who)return;ST.codes[code]=Object.assign({},ST.codes[code],{who});n++;});
 if(n)try{await db.ref('usr/players/'+ST.admin.save+'/codes').set(ST.codes);ST.flash=`✅ Saved ${n} player name${n>1?'s':''}.`;ST.reveal=true;}catch(e){ST.flash='⚠️ Could not save the names.';}
 history.replaceState(null,'',location.pathname+location.search);}
// ---------- data ----------
async function load(){ST.loading=true;draw();const out=[];
 await Promise.all(Object.keys(ST.codes).map(async code=>{const save=await sha(S1+code),net=await sha(S2+code);let rec=null;try{rec=(await db.ref('usr/players/'+save).once('value')).val();}catch(e){}
  const ev=[];if(rec&&rec.ev)for(const d in rec.ev)for(const id in rec.ev[d]){const e=rec.ev[d][id];if(e&&e.k&&e.t)ev.push(e);}ev.sort((a,b)=>a.t-b.t);
  let sv=null;try{sv=rec&&rec.save?JSON.parse(rec.save):null;}catch(e){}
  out.push({code,save,net,pc:'P-'+net.slice(0,4).toUpperCase(),who:ST.codes[code].who||'',tag:rec&&rec.tag||'',rec,live:rec&&rec.live||null,ev,act:(rec&&rec.act)||{},sv,last:Math.max(rec&&rec.upd||0,ev.length?ev[ev.length-1].t:0)});}));
 ST.P=out.sort((a,b)=>b.last-a.last||a.code.localeCompare(b.code));ST.loading=false;ST.when=Date.now();draw();}
const since=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()-(ST.range-1)*DAY;};
const inR=e=>e.t>=since();
function allEv(f){const r=[];for(const p of ST.P)for(const e of p.ev)if(!f||f(e))r.push(Object.assign({p},e));return r;}
function days(n){const out=[];const d=new Date();d.setHours(12,0,0,0);for(let i=n-1;i>=0;i--)out.push(dayK(d.getTime()-i*DAY));return out;}
const chartDays=()=>(ST.curD=days(Math.max(ST.range,7)));
function activeOn(p,k){if((p.act[k]|0)>0)return true;return p.ev.some(e=>e.k!=='open'&&e.k!=='sv'&&dayK(e.t)===k);}
function nm(p){return ST.reveal?(p.who?`<span class="real">${esc(p.who)}</span>`:'<span class="tiny">No name yet</span>')+` <span class="pcode">${p.pc}</span>`:`<span class="pcode">${p.pc}</span>`;}
const nmTxt=p=>ST.reveal?[p.who||'No name yet',p.pc,p.tag,p.code].filter(Boolean).join(' · '):p.pc;
// ---------- charts ----------
function relMarks(n){const D=ST.curD;if(!D||D.length!==n)return[];const R=releases();return D.map((k,i)=>({i,r:R.filter(r=>dayK(r.t)===k)})).filter(o=>o.r.length);}
function markSvg(n,xf,H){return relMarks(n).map(o=>{const x=xf(o.i);return`<line x1="${x}" x2="${x}" y1="0" y2="${H-6}" stroke="#ffc23d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x+3}" y="10" style="fill:#ffc23d;font-weight:800">v${o.r.map(r=>r.v).join(',v')}</text>`;}).join('');}
function bars(rows,opt={}){const W=600,H=opt.h||150,pad=24,n=rows.length,max=Math.max(1,...rows.map(r=>(r.v||0)+(r.v2||0))),bw=(W-pad)/n;
 let s=`<svg viewBox="0 0 ${W} ${H+18}" role="img">`+markSvg(n,i=>pad+i*bw+bw*.5,H);for(let i=0;i<=2;i++){const y=6+(H-12)*(1-i/2);s+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#ffffff12"/><text x="0" y="${y+3}">${Math.round(max*i/2)}</text>`;}
 rows.forEach((r,i)=>{const x=pad+i*bw+bw*.15,w=bw*.7,h1=(H-12)*(r.v||0)/max,h2=(H-12)*(r.v2||0)/max,base=H-6;
  if(h1)s+=`<rect x="${x}" y="${base-h1}" width="${w}" height="${h1}" rx="2" fill="${opt.c||'#05d9e8'}"><title>${esc(r.l)}: ${r.v}</title></rect>`;if(h2)s+=`<rect x="${x}" y="${base-h1-h2}" width="${w}" height="${h2}" rx="2" fill="${opt.c2||'#ff5470'}"><title>${esc(r.l)}: ${r.v2}</title></rect>`;
  if(n<=16||i%Math.ceil(n/10)===0)s+=`<text x="${x+w/2}" y="${H+12}" text-anchor="middle">${esc(r.l)}</text>`;});
 return s+'</svg>'+(opt.lg?`<div class="lg">${opt.lg.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`:'');}
function hbars(rows,opt={}){const max=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${r.l}</span><b>${r.v}</b></div><div class="funnel"><div class="track" style="height:10px"><i style="width:${Math.max(r.v?3:0,r.v/max*100)}%;background:${opt.c||'var(--cyan)'}"></i></div></div></div>`).join('')||'<div class="mute">No data yet.</div>';}
function line(series,labels,opt={}){const W=600,H=opt.h||140,pad=24,n=labels.length,max=Math.max(1,...series.flatMap(s=>s.d));const x=i=>pad+6+i*(W-pad-12)/Math.max(1,n-1),y=v=>6+(H-12)*(1-v/max);
 let s=`<svg viewBox="0 0 ${W} ${H+18}" role="img">`+markSvg(n,x,H);for(let i=0;i<=2;i++){const yy=y(max*i/2);s+=`<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#ffffff12"/><text x="0" y="${yy+3}">${Math.round(max*i/2)}</text>`;}
 series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.5" stroke-linejoin="round" points="${se.d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;se.d.forEach((v,i)=>{if(v)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${se.c}"><title>${esc(labels[i])}: ${v}</title></circle>`;});});
 labels.forEach((l,i)=>{if(n<=12||i%Math.ceil(n/8)===0)s+=`<text x="${x(i)}" y="${H+12}" text-anchor="middle">${esc(l)}</text>`;});
 return s+'</svg>'+`<div class="lg">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}</div>`;}
const kpi=(l,v,sub,c)=>`<div class="card kpi"><span>${l}</span><b style="color:${c||'var(--ink)'}">${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
function table(id,cols,rows,opt={}){const q=(ST.q[id]||'').toLowerCase();const vis=q?rows.filter(r=>(r.s||'').toLowerCase().includes(q)):rows;ST.exp[id]={cols,rows:vis};
 return`${opt.search?`<input class="search" data-q="${id}" placeholder="${opt.search}" value="${esc(ST.q[id]||'')}">`:''}<div class="card scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'num':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${vis.map(r=>`<tr class="${r.click?'click':''}" ${r.click?`data-open="${r.click}"`:''}>${r.c.map((v,i)=>`<td class="${cols[i].n?'num':''}">${v}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="mute">${q?'No matches.':'Nothing yet.'}</td></tr>`}</tbody></table></div>`;}

const isLive=p=>!!(p.live&&Date.now()-p.live.t<LIVE_MS);
const liveP=()=>ST.P.filter(isLive).sort((a,b)=>(a.live.s||0)-(b.live.s||0));
function liveCard(p){const L=p.live,fps=L.f|0;let det='';if(L.a==='chase'&&L.d)det=' · wanted level '+esc(String(L.d).replace(/\D/g,''));
 return`<div class="live" data-open="${p.code}"><span class="dot"></span><div style="flex:1;min-width:0"><div>${nm(p)}</div><div class="a">${ACT[L.a]||esc(L.a)}${det}</div>
 <div class="m">${CITY[L.c]||esc(L.c||'—')}${L.car?' · '+esc(L.car):''}${L.lv?' · Level '+L.lv:''}${L.s?' · in game '+dur((Date.now()-L.s)/1000).replace(/ \d+s$/,''):''}</div>
 <div>${L.on?`<span class="chip">🌐 Online${L.nb?` · ${L.nb} nearby`:''}</span>`:'<span class="chip">Solo / offline</span>'}<span class="chip">${L.mob?'📱 Phone/tablet':'💻 Computer'}</span><span class="chip">${LANGN[L.lang]||esc(L.lang||'')}</span>${fps?`<span class="chip ${fps<25?'bad':''}">${fps} fps${fps<25?' · laggy':''}</span>`:''}${L.v?`<span class="chip">v${esc(L.v)}</span>`:''}</div></div><span class="tiny">${ago(L.t)}</span></div>`;}
function liveBlock(max){const L=liveP();return`<div class="card">${L.length?L.slice(0,max||99).map(liveCard).join('')+(max&&L.length>max?`<div class="tiny" style="padding-top:8px">+${L.length-max} more → Live now</div>`:''):'<div class="mute">Nobody is playing right now.</div>'}<div class="tiny" style="margin-top:6px">Updates every 15 seconds · <span id="livestamp">${ST.lastLive?'checked '+ago(ST.lastLive):''}</span></div></div>`;}
function vLive(){const L=liveP(),by=k=>{const o={};L.forEach(p=>{const v=p.live[k];o[v]=(o[v]||0)+1;});return o;},act=by('a'),city=by('c');

  try{if(a==='lock')await ref.update({lock:1});if(a==='unlock')await ref.update({lock:0});if(a==='reset')await ref.update({devs:''});if(a==='plus')await ref.update({lock:1,devMax:3});p.rec=(await ref.once('value')).val();}catch(e){alert('Could not update.');}draw();});}
function exportTab(){const k={map:'hot',features:'feat',login:'login',first:'first',games:'games',online:'online',sponsors:'sponsors',players:ST.sel?'timeline':'players',errors:'errors'}[ST.tab];
 let cols=[],rows=[];if(k&&ST.exp[k]){cols=ST.exp[k].cols.map(c=>c.h);rows=ST.exp[k].rows.map(r=>r.c);}
 if(!cols.length){const D=days(ST.range);cols=['Day','Active players','Games','Minutes played','Errors'];rows=D.map(d=>[d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6),ST.P.filter(p=>activeOn(p,d)).length,allEv(e=>e.k==='g'&&dayK(e.t)===d).length,ST.P.reduce((a,p)=>a+(p.act[d]|0),0),allEv(e=>e.k==='err'&&dayK(e.t)===d).length]);}
 const clean=v=>String(v==null?'':v).replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\s+/g,' ').trim(),csv=[cols,...rows].map(r=>r.map(v=>'"'+clean(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=`usr-${ST.tab}${ST.sel?'-timeline':''}-${dayK(Date.now())}${ST.reveal?'-names':''}.csv`;document.body.appendChild(a);a.click();a.remove();}
async function pollLive(){if(!ST.admin||ST.loading||!ST.P.length||document.hidden)return;let ch=false;
 await Promise.all(ST.P.filter(p=>p.rec).map(async p=>{try{const v=(await db.ref('usr/players/'+p.save+'/live').once('value')).val();if(JSON.stringify(v)!==JSON.stringify(p.live)){p.live=v;ch=true;}}catch(e){}}));
 ST.lastLive=Date.now();const ae=document.activeElement;if(ch&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))draw();else{const el=document.getElementById('livestamp');if(el)el.textContent='checked '+ago(ST.lastLive);}}
setInterval(pollLive,15000);
setInterval(()=>{const ae=document.activeElement;if(ST.admin&&!ST.loading&&!document.hidden&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))load();},120000);
(async()=>{let c=null;try{c=localStorage.getItem(DK);}catch(e){}if(c)signIn(c,true);else renderLogin();})();
</script>
